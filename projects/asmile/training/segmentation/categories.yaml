# Semantic segmentation categories for Asmile autonomous tricycle.
# Colours follow Cityscapes conventions where applicable.

categories:
  - id: 0
    name: background
    color: [0, 0, 0]
  - id: 1
    name: road
    color: [128, 64, 128]
  - id: 2
    name: sidewalk
    color: [244, 35, 232]
  - id: 3
    name: person
    color: [220, 20, 60]
  - id: 4
    name: vehicle
    color: [0, 0, 142]
  - id: 5
    name: bicycle
    color: [119, 11, 32]
  - id: 6
    name: wall
    color: [102, 102, 156]
  - id: 7
    name: building
    color: [70, 70, 70]
  - id: 8
    name: pole
    color: [153, 153, 153]
  - id: 9
    name: vegetation
    color: [107, 142, 35]
  - id: 10
    name: sky
    color: [70, 130, 180]
  - id: 11
    name: obstacle
    color: [255, 0, 0]
  - id: 12
    name: animal
    color: [255, 165, 0]

drivable:
  safe: [1]                    # road
  caution: [2]                 # sidewalk
  stop: [3, 4, 5, 11, 12]     # people, vehicles, bikes, obstacles, animals
  ignore: [0, 6, 7, 8, 9, 10] # background, walls, buildings, poles, vegetation, sky
